# ─────────────────────────────────────────────────────────────────────────────
# SDLC Platform — EC2 Docker Compose (pre-built images)
#
# Usage:
#   ./scripts/deploy.sh          # first run and subsequent deploys
#
# Images (build locally, deployed via SSH pipe):
#   redis:7-alpine               :6379   — pulled directly on EC2
#   sdlc-atlassian-bridge        :8002   — internal only (no host port)
#   sdlc-copilot-agent           :8001   — exposed publicly
#   sdlc-arq-worker              (internal) — job worker
#   sdlc-frontend                :3000   — exposed publicly
# ─────────────────────────────────────────────────────────────────────────────

services:

  redis:
    image: redis:7-alpine
    platform: linux/amd64
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  atlassian-bridge:
    image: sdlc-atlassian-bridge
    platform: linux/amd64
    restart: unless-stopped
    env_file: .env
    # No host port binding — accessible only within the Docker network
    expose:
      - "8002"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  copilot-agent:
    image: sdlc-copilot-agent
    platform: linux/amd64
    restart: unless-stopped
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
      ATLASSIAN_BRIDGE_URL: http://atlassian-bridge:8002
      AGENTS_DIR: /app/agents
      SKILLS_DIR: /app/skills
      TEAMS_DIR: /app/teams
    ports:
      - "8001:8001"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  arq-worker:
    image: sdlc-arq-worker
    platform: linux/amd64
    command: ["agent-worker"]
    restart: unless-stopped
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
      ATLASSIAN_BRIDGE_URL: http://atlassian-bridge:8002
      AGENTS_DIR: /app/agents
      SKILLS_DIR: /app/skills
      TEAMS_DIR: /app/teams
    depends_on:
      redis:
        condition: service_healthy
      copilot-agent:
        condition: service_healthy

  frontend:
    image: sdlc-frontend
    platform: linux/amd64
    restart: unless-stopped
    env_file: .env
    environment:
      NEXT_PUBLIC_API_URL: http://copilot-agent:8001
      PORT: "3000"
    ports:
      - "3000:3000"
    depends_on:
      copilot-agent:
        condition: service_healthy

volumes:
  redis_data:
